<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>태창 철거</title>

<style>

body{
margin:0;
font-family:Arial;
}

.header{

background-size:cover;
background-position:center center;
background-repeat:no-repeat;
height:70vh;
min-height:450px;
max-height:650px;
position:relative;
color:white;
}

.overlay{
background:rgba(0,0,0,0.5);
height:100%;
display:flex;

justify-content:center;

text-align:center;
}

.phone{

font-weight:bold;

}

.menu{
background:white;
padding:15px;
text-align:center;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.menu a{
margin:20px;
text-decoration:none;
color:black;
font-weight:bold;
}

.section{
padding:60px;
text-align:center;
}

.services{
display:flex;
justify-content:center;
gap:30px;
margin-top:40px;
}

.card{
background:white;
padding:30px;
width:250px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
border-radius:10px;
}

.card:hover{

</head>

<body>

<div class="header">

<h2>철거 서비스</h2>

<div class="services">

<div class="card">

<h3>상가 철거</h3>

<p>식당 / 카페 / 매장 철거</p>

</div>

<div class="card">

<h3>사무실 철거</h3>
